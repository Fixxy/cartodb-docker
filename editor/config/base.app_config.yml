defaults: &defaults
  ogr2ogr:
    binary: which ogr2ogr
  http_port: 
  https_port: 
  session_domain: ${PUBLIC_HOST}
  account_host:   ${PUBLIC_URL}
  subdomainless_urls: true
  vizjson_cache_domains:
    - ${PUBLIC_HOST}
  common_data:
    protocol: ${PUBLIC_PROTOCOL}
    username: ${DEFAULT_USER}
  tiler:
    internal:
      protocol: http
      domain:   cartodb-mapsapi
      host:     cartodb-mapsapi
    private: &routing_defaults
      protocol: ${PUBLIC_PROTOCOL}
      domain:   ${PUBLIC_HOST}
      port:     ${PUBLIC_PORT}
    public:
      <<: *routing_defaults
  sql_api:
    private:
      <<: *routing_defaults
    public:
      <<: *routing_defaults
  redis:
    host: cartodb-redis
  org_metadata_api:
    host: ${PUBLIC_HOST}
  importer:
    python_bin_path: '/usr/bin/python2'
  app_assets:
    asset_host: "${PUBLIC_PROTOCOL}://${PUBLIC_HOST}"
  layer_opts:
    data:
      options:
        tiler_domain:   ${PUBLIC_HOST}
        tiler_port:     ${PUBLIC_PORT}
        tiler_protocol: ${PUBLIC_PROTOCOL}
        sql_domain:     ${PUBLIC_HOST}
        sql_port:       ${PUBLIC_PORT}
        sql_protocol:   ${PUBLIC_PROTOCOL}
  cartodb_com_hosted: false
  connectors:
    odbc:
      enabled: false
      max_rows: nil
    mysql:
      enabled: true
      max_rows: 500000
    postgres:
      enabled: true
      max_rows: 500000
    sqlserver:
      enabled: true
      max_rows: 500000
    bigquery:
      enabled: true
      max_rows: 1000000
  oauth:
    gdrive:
      application_name:     'CartoDB GDrive OAuth'
      client_id:            ${GDRIVE_OAUTH_CLIENT_ID}
      client_secret:        ${GDRIVE_OAUTH_CLIENT_SECRET}
      callback_url:         "${PUBLIC_PROTOCOL}://${PUBLIC_HOST}/user/${DEFAULT_USER}/api/v1/imports/service/gdrive/oauth_callback"

development:
  <<: *defaults

test:
  <<: *defaults

staging:
  <<: *defaults

production:
  <<: *defaults
